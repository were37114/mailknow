name: Build Windows Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: false
        default: '1.0.0'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install fastapi uvicorn asyncpg pgvector python-multipart pydantic python-jose passlib bcrypt aioimaplib email-validator python-dateutil numpy sentence-transformers torch
    
    - name: Build Python backend with PyInstaller
      run: |
        cd src/api
        pyinstaller --name mailknow --onefile --windowed `
          --add-data "../..:src" `
          --hidden-import uvicorn.logging `
          --hidden-import uvicorn.loops `
          --hidden-import uvicorn.loops.auto `
          --hidden-import uvicorn.protocols `
          --hidden-import uvicorn.protocols.http `
          --hidden-import uvicorn.protocols.http.auto `
          --hidden-import uvicorn.protocols.websockets `
          --hidden-import uvicorn.protocols.websockets.auto `
          --hidden-import uvicorn.lifespan `
          --hidden-import uvicorn.lifespan.on `
          server.py
        mv dist/mailknow.exe ../../client/build/
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install Electron dependencies
      run: |
        cd client
        npm install
    
    - name: Build Electron app
      run: |
        cd client
        npm run build
    
    - name: Package Windows installer
      run: |
        cd client
        npx electron-builder --win nsis --x64
    
    - name: Upload Windows installer
      uses: actions/upload-artifact@v4
      with:
        name: MailKnow-Windows-Installer
        path: client/release/*.exe
        retention-days: 7
    
    - name: Upload Windows portable
      uses: actions/upload-artifact@v4
      with:
        name: MailKnow-Windows-Portable
        path: client/release/win-unpacked
        retention-days: 7
